<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXEL TRADING FLOOR</title>
<link rel="stylesheet" href="/static/floor.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="logo">▚▚</span>
    <span>PIXEL TRADING FLOOR</span>
    <span class="ver">v1.2</span>
  </div>
  <form class="controls" id="controls" autocomplete="off">
    <input id="symbol" maxlength="32" placeholder="BTC · TSLA · 하이닉스" value="하이닉스">
    <div class="modes" id="modes"></div>
    <button type="submit" id="run">▶ ANALYZE</button>
  </form>
  <a class="reports-link" href="/reports">리포트</a>
</header>

<div class="mode-note" id="modeNote"></div>

<main>
  <section class="left">

    <div class="ticker" id="ticker">
      <div class="ticker-head">
        <div>
          <div class="sym" id="tkSym">—</div>
          <div class="basis" id="tkBasis"></div>
        </div>
        <div class="price-wrap">
          <div class="led" id="tkPrice">------</div>
          <div class="chg" id="tkChg"></div>
        </div>
        <div class="badges" id="tkBadges"></div>
      </div>
      <canvas id="chart" width="720" height="150"></canvas>
      <div class="legend">
        <span><i class="sw gold"></i>MA20</span>
        <span><i class="sw blue"></i>MA50</span>
        <span><i class="sw dash"></i>20봉 고·저</span>
        <span id="chartSrc" class="src"></span>
      </div>
      <table class="board" id="board" hidden></table>
    </div>

    <div class="rooms">
      <div class="room" data-room="analysts"><h2>애널리스트 팀</h2><div class="seats"></div></div>
      <div class="room" data-room="research"><h2>리서치룸</h2><div class="seats"></div></div>
      <div class="room" data-room="risk"><h2 id="riskTitle">리스크 위원회</h2><div class="seats"></div></div>
      <div class="room desk" data-room="desk">
        <h2>트레이딩 본부</h2>
        <div class="desk-split">
          <div class="seats"></div>
          <div class="verdict" id="verdict">
            <div class="v-action" id="vAction">READY</div>
            <div class="gauge"><div class="fill" id="vGauge"></div></div>
            <div class="v-conf" id="vConf">확신도 —</div>
            <dl class="v-levels">
              <div><dt>진입</dt><dd id="vEntry">—</dd></div>
              <div><dt>손절</dt><dd id="vStop">—</dd></div>
              <div><dt>목표</dt><dd id="vTarget">—</dd></div>
              <div><dt>비중</dt><dd id="vSize">—</dd></div>
            </dl>
            <div class="pm" id="vPm" hidden></div>
            <p class="v-why" id="vWhy"></p>
            <!-- 검증 관문. 알고리즘 모드에서만 뜬다. -->
            <div class="gate" id="vGate" hidden>
              <div class="gate-head" id="vGateHead"></div>
              <div class="gate-lines" id="vGateLines"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <aside class="console">
    <div class="tabs">
      <button class="tab on" data-track="all">전체</button>
      <button class="tab" data-track="agent">에이전트</button>
      <button class="tab" data-track="debate">토론</button>
      <span class="progress" id="progress"></span>
    </div>
    <div class="log" id="log"></div>
  </aside>
</main>

<footer class="disclaimer">
  AI 시뮬레이션입니다. 투자 조언이 아니며 실제 주문·자금 이동은 일어나지 않습니다.
  거래소 API 키와 결제 수단을 쓰지 않고, 결과는 이 PC에만 저장됩니다.
</footer>

<div class="toast" id="toast" hidden></div>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <button class="close" id="modalClose">✕</button>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<script src="/static/floor.js"></script>
</body>
</html>
