name: 페이퍼 트레이딩 자동 실행 (Toss - 미국)

on:
  # 가상 장부 모드로 재개 (BROKER=virtual). 실주문은 나가지 않고
  # 매수·매도가 virtual_portfolio.json 에만 기록된다.
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
  # 아래 기본값은 아래쪽 env 의 `|| 대체값` 과 반드시 같아야 한다.
  # 수동 실행하면 GitHub가 이 기본값을 채워 넣어 `||` 가 무시되므로,
  # 값이 어긋나면 수동 실행만 다른 조건으로 돌아 성적표가 오염된다.
  # 실제로 2026-07-30 수동 검증에서 종목당 $100로 돌아 45원짜리
  # 주문 14건이 장부에 남았다.
    inputs:
      dry_run:
        # 이 항목만 일부러 아래 `|| 'false'` 와 다르다. 예약 실행은 장부에
        # 기록해야 하고(false), 수동 실행은 실수로 장부를 건드리지 않도록
        # 기본을 true(기록 안 함)로 둔다. 수동으로 진짜 기록하려면
        # -f dry_run=false 를 명시할 것.
        description: "DRY_RUN (true=기록 안 함, false=장부에 기록)"
        required: false
        default: "true"
      universe:
        description: "유니버스 이름 (';'로 복수 지정)"
        required: false
        default: "미국 중소형 30;미국 금융주 15;미국 가치배당주 20;미국 AI·빅테크 15;미국 헬스케어 15"
      top_n:
        description: "매수 상위 N개"
        required: false
        default: "5"
      capital_usd:
        description: "미국 종목당 투입금 (달러)"
        required: false
        default: "1370"
      krw_per_usd:
        description: "원/달러 환율 (매수여력 비교용)"
        required: false
        default: "1400"
      trail_stop_pct:
        description: "트레일링 스톱 % (0이면 비활성)"
        required: false
        default: "10"
      buy_score_min:
        description: "최소 매수 점수 (10~90)"
        required: false
        default: "60"
      portfolio_dd_stop_pct:
        description: "포트폴리오 드로다운 스톱 % (0이면 비활성)"
        required: false
        default: "15"
      max_sector_positions:
        description: "동일 섹터 최대 보유 종목 수"
        required: false
        default: "3"
      neutral_max_positions:
        description: "neutral 레짐 최대 포지션 수"
        required: false
        default: "7"
      bear_max_positions:
        description: "bear 레짐 최대 포지션 수"
        required: false
        default: "4"

concurrency:
  group: paper-trade-us
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-paper-trade-us:
    # BROKER=virtual 인 동안에는 클라우드 러너를 쓴다.
    #
    # 자택 러너를 쓰던 이유는 토스 오픈API의 IP 화이트리스트 하나였다(클라우드
    # 에서는 oauth2/token 이 403 access_denied). 가상 장부 모드는 토스를 한 번도
    # 부르지 않으므로 그 제약이 없다.
    #
    # 대신 자택 러너에는 PC가 꺼져 있으면 잡이 큐에서 기다린다는 문제가 있다.
    # 2026-07-31 예약분이 러너를 16시간 기다렸다 실행됐다(실행 자체는 1분).
    #
    # ⚠️ BROKER 를 toss 로 되돌리면 이 줄도 [self-hosted, Windows] 로 되돌릴 것.
    #    안 그러면 토스 인증이 403 으로 전량 실패한다(07-17~28 12일간 겪음).
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 토스 트레이딩 실행 (미국 종목)
        env:
          PYTHONUTF8:            "1"
          # 가상 장부 모드 — 실주문 없음. 계좌만 갈아끼우고 전략 경로는 동일.
          BROKER:                "virtual"
          VIRTUAL_CAPITAL_KRW:   "10000000"
          TOSS_CLIENT_ID:        ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET:    ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ:      ${{ secrets.TOSS_ACCOUNT_SEQ }}
          TELEGRAM_TOKEN:        ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          DART_API_KEY:          ${{ secrets.DART_API_KEY }}
          UNIVERSE:              ${{ github.event.inputs.universe || '미국 중소형 30;미국 금융주 15;미국 가치배당주 20;미국 AI·빅테크 15;미국 헬스케어 15' }}
          TOP_N:                 ${{ github.event.inputs.top_n || '5' }}
          CAPITAL_KRW:           "500000"
          # 1,000만원 / 5종목 ÷ 환율 약 1,460 = 종목당 약 1,370달러
          CAPITAL_USD:           ${{ github.event.inputs.capital_usd || '1370' }}
          KRW_PER_USD:           ${{ github.event.inputs.krw_per_usd || '1400' }}
          # 5종목으로는 1,000만 중 410만밖에 안 들어간다. 종목당 기준액
          # $1,370(약 200만)이 변동성·상관관계 사이징에서 약 82만까지 깎이기
          # 때문이다. 종목당 금액을 억지로 키우면 한 종목 노출이 2.4배가 되므로,
          # 금액은 그대로 두고 종목 수로 채운다 — 분산이 늘고 성적표에 쌓이는
          # 표본도 두 배가 된다. 약 82만 × 10종목 = 약 820만.
          MAX_POSITIONS:         "10"
          TRAIL_STOP_PCT:        ${{ github.event.inputs.trail_stop_pct || '10' }}
          BUY_SCORE_MIN:         ${{ github.event.inputs.buy_score_min || '60' }}
          PORTFOLIO_DD_STOP_PCT: ${{ github.event.inputs.portfolio_dd_stop_pct || '15' }}
          # 10종목을 채우려면 섹터 한도도 함께 풀어야 한다. 2로 두면 후보가
          # 금융주에 몰려 있어 5~6종목에서 멈춘다. 3이면 한 섹터가 30%를
          # 넘지 않으면서 10종목이 찬다.
          MAX_SECTOR_POSITIONS:  ${{ github.event.inputs.max_sector_positions || '3' }}
          NEUTRAL_MAX_POSITIONS: ${{ github.event.inputs.neutral_max_positions || '7' }}
          BEAR_MAX_POSITIONS:    ${{ github.event.inputs.bear_max_positions || '4' }}
          # 가상 브로커에서는 DRY_RUN=false 여야 장부에 체결이 기록된다.
          # true 로 두면 예약조차 남지 않아 데이터가 쌓이지 않는다.
          # 실주문 위험은 BROKER=virtual 이 차단한다.
          DRY_RUN:               ${{ github.event.inputs.dry_run || 'false' }}
        run: python paper_trade_runner_toss.py

      - name: 추적 파일 커밋 (고점·시그널·자본·가상 포트폴리오)
        # 클라우드 러너로 옮기면서 PowerShell에서 bash로 되돌렸다. PowerShell을
        # 쓰던 이유는 자택 러너의 서비스 PATH에 bash.exe가 없어서였다("bash:
        # command not found"로 이 단계만 죽고, 매매 계산은 멀쩡히 끝나는데 결과만
        # 사라지는 상태가 2026-07-15부터 이어졌다). 로직은 그대로 옮겼다.
        shell: bash
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          # 중단된 rebase가 남아 있으면 이후 pull이 전부 막힌다. 실제로
          # 2026-07-13 rebase 찌꺼기가 방치돼 7월 내내 결과가 안 올라갔다.
          # HEAD는 건드리지 않고 상태만 정리한다(--quit).
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            echo "WARNING: stale rebase state found - clearing it"
            git rebase --quit
          fi

          # virtual_portfolio.json 은 첫 매매 전에는 없다. 없는 파일을
          # git add 하면 pathspec 오류로 단계가 통째로 실패하므로 걸러낸다.
          # (셸이 -e 로 돌므로 test 실패가 단계를 죽이지 않게 if 로 감싼다)
          tracked=()
          for f in peak_prices.json signal_log.json equity_log.json virtual_portfolio.json; do
            if [ -f "$f" ]; then tracked+=("$f"); fi
          done

          if [ ${#tracked[@]} -eq 0 ]; then
            echo "No tracked files to commit."
            exit 0
          fi

          git add -- "${tracked[@]}"
          if git diff --staged --quiet; then
            echo "No changes staged - nothing to commit."
            exit 0
          fi

          git commit -m "chore: US peak/signal/equity/portfolio update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

          echo "Committed and pushed: ${tracked[*]}"
