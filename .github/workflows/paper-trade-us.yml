name: 페이퍼 트레이딩 자동 실행 (Toss - 미국)

on:
  # 가상 장부 모드로 재개 (BROKER=virtual). 실주문은 나가지 않고
  # 매수·매도가 virtual_portfolio.json 에만 기록된다.
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (true=주문 없음, false=실제 주문)"
        required: false
        default: "true"
      universe:
        description: "유니버스 이름 (';'로 복수 지정)"
        required: false
        default: "미국 중소형 30;미국 금융주 15;미국 가치배당주 20;미국 AI·빅테크 15;미국 헬스케어 15"
      top_n:
        description: "매수 상위 N개"
        required: false
        default: "2"
      capital_usd:
        description: "미국 종목당 투입금 (달러)"
        required: false
        default: "100"
      krw_per_usd:
        description: "원/달러 환율 (매수여력 비교용)"
        required: false
        default: "1400"
      trail_stop_pct:
        description: "트레일링 스톱 % (0이면 비활성)"
        required: false
        default: "10"
      buy_score_min:
        description: "최소 매수 점수 (10~90)"
        required: false
        default: "60"
      portfolio_dd_stop_pct:
        description: "포트폴리오 드로다운 스톱 % (0이면 비활성)"
        required: false
        default: "15"
      max_sector_positions:
        description: "동일 섹터 최대 보유 종목 수"
        required: false
        default: "2"
      neutral_max_positions:
        description: "neutral 레짐 최대 포지션 수"
        required: false
        default: "7"
      bear_max_positions:
        description: "bear 레짐 최대 포지션 수"
        required: false
        default: "4"

concurrency:
  group: paper-trade-us
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-paper-trade-us:
    # 토스 오픈API는 IP 화이트리스트를 적용한다. 자택 IP만 등록돼 있으므로
    # 클라우드 러너로 옮기면 oauth2/token이 403 access_denied로 거부된다.
    # 클라우드로 되돌리려면 먼저 해당 러너의 고정 IP를 토스에 등록할 것.
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      # setup-python은 쓰지 않는다. self-hosted(Windows) 러너에서 파이썬 설치
      # 관리자 권한이 없어 실패한다. PC에 설치된 시스템 파이썬을 그대로 쓴다.
      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 토스 트레이딩 실행 (미국 종목)
        env:
          PYTHONUTF8:            "1"
          # 가상 장부 모드 — 실주문 없음. 계좌만 갈아끼우고 전략 경로는 동일.
          BROKER:                "virtual"
          VIRTUAL_CAPITAL_KRW:   "10000000"
          TOSS_CLIENT_ID:        ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET:    ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ:      ${{ secrets.TOSS_ACCOUNT_SEQ }}
          TELEGRAM_TOKEN:        ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          DART_API_KEY:          ${{ secrets.DART_API_KEY }}
          UNIVERSE:              ${{ github.event.inputs.universe || '미국 중소형 30;미국 금융주 15;미국 가치배당주 20;미국 AI·빅테크 15;미국 헬스케어 15' }}
          TOP_N:                 ${{ github.event.inputs.top_n || '5' }}
          CAPITAL_KRW:           "500000"
          # 1,000만원 / 5종목 ÷ 환율 약 1,460 = 종목당 약 1,370달러
          CAPITAL_USD:           ${{ github.event.inputs.capital_usd || '1370' }}
          KRW_PER_USD:           ${{ github.event.inputs.krw_per_usd || '1400' }}
          MAX_POSITIONS:         "5"
          TRAIL_STOP_PCT:        ${{ github.event.inputs.trail_stop_pct || '10' }}
          BUY_SCORE_MIN:         ${{ github.event.inputs.buy_score_min || '60' }}
          PORTFOLIO_DD_STOP_PCT: ${{ github.event.inputs.portfolio_dd_stop_pct || '15' }}
          MAX_SECTOR_POSITIONS:  ${{ github.event.inputs.max_sector_positions || '2' }}
          NEUTRAL_MAX_POSITIONS: ${{ github.event.inputs.neutral_max_positions || '7' }}
          BEAR_MAX_POSITIONS:    ${{ github.event.inputs.bear_max_positions || '4' }}
          # 가상 브로커에서는 DRY_RUN=false 여야 장부에 체결이 기록된다.
          # true 로 두면 예약조차 남지 않아 데이터가 쌓이지 않는다.
          # 실주문 위험은 BROKER=virtual 이 차단한다.
          DRY_RUN:               ${{ github.event.inputs.dry_run || 'false' }}
        run: python paper_trade_runner_toss.py

      - name: 추적 파일 커밋 (고점·시그널 로그)
        # Windows 러너의 기본 셸은 PowerShell이라 아래 bash 문법이 통하지 않는다.
        # Git for Windows의 bash를 명시적으로 지정한다.
        shell: bash
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add peak_prices.json signal_log.json equity_log.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: US peak & signal & equity log update $(date -u +%Y-%m-%d)"
          fi
          git pull --rebase origin main
          git push
