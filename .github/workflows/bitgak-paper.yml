name: 빗각 8단계 페이퍼 배관 번인 (평일 15:30~16:15 ET)

# 사전 등록: stock-analyzer/docs/superpowers/specs/2026-09-05-bitgak-stage8-design.md §11.3
#
# ⚠️ 이 저장소에서 **장중 시각을 지켜야 하는 첫 워크플로**다. 나머지 크론은
#    전부 장 마감 뒤에 돈다(21:30·22:07·22:37·22:52 UTC). 마감 뒤에는 무해했던
#    성질 둘이 여기서는 판정선(②)을 직접 때린다:
#
#      1. 예약 실행은 밀린다. 부하가 몰리면 수 분~수십 분, 드물게 건너뛴다.
#      2. cron 은 UTC 고 ET 는 매년 두 번 한 시간 움직인다. 15:50 짜리 창에서는
#         **한 시간 통째로 빗나간다** — 그래서 EDT·EST 두 벌을 다 적는다.
#
#    대책은 **크론 넷 + 멱등**이고, 그게 통했는지가 ② 다. 지연 자체는 관측
#    대상이지 대책이 아니다. 창 밖 회차는 스크립트가 ET 시계를 직접 검사해
#    즉시 종료한다 — 절반은 매번 헛돈다(그게 설계다).
#
#    대책이 만든 새 위험은 "같은 종목에 주문을 두 번"이다. 그래서 각 회차는
#    `bitgak8-{YYYYMMDD}-` 접두사로 오늘 주문을 먼저 조회하고, 이미 있으면
#    아무것도 안 한다. 멱등이 없으면 크론 넷은 대책이 아니라 중복 주문 기계다.

on:
  schedule:
    # ── 제출 창: 15:30 / 15:35 / 15:40 / 15:45 ET (브로커 컷오프 15:50) ──
    - cron: "30 19 * * 1-5"   # EDT
    - cron: "35 19 * * 1-5"
    - cron: "40 19 * * 1-5"
    - cron: "45 19 * * 1-5"
    - cron: "30 20 * * 1-5"   # EST
    - cron: "35 20 * * 1-5"
    - cron: "40 20 * * 1-5"
    - cron: "45 20 * * 1-5"
    # ── 체결 확정 · 다리 등록/정정 · 상호 취소: 16:15 ET ──
    - cron: "15 20 * * 1-5"   # EDT
    - cron: "15 21 * * 1-5"   # EST
  workflow_dispatch:
    inputs:
      dry_run:
        # 예약 실행은 진짜로 낸다(false). 수동 실행은 실수로 페이퍼에 주문이
        # 새지 않도록 기본을 true 로 둔다 (index-autopilot.yml 과 같은 이유).
        description: "DRY_RUN (true=주문 안 냄, false=진짜 제출)"
        required: false
        default: "true"

concurrency:
  # 크론 넷이 겹쳐도 순서대로 돈다. 취소하지 않는다 — 취소된 회차가 제출 직후에
  # 죽으면 장부에 안 적힌 주문이 남는다.
  group: bitgak-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  burn-in:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-analyzer
    timeout-minutes: 25

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 제출·정산 둘 다 부른다. 각자 ET 시계를 보고 창 밖이면 즉시 종료하므로
      # 크론을 job 으로 갈라 라우팅할 필요가 없다 — 갈래가 없으면 틀릴 자리도 없다.
      - name: 스캔 → 제출 (15:30~15:50 ET 창에서만)
        env:
          PYTHONUTF8: "1"
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # ★ 페이퍼 고정. 9단계 전까지 실계좌는 이 저장소의 어떤 코드도 안
          #   건드린다 — 러너도 `_require_paper()` 로 한 번 더 막는다.
          ALPACA_PAPER: "true"
        run: |
          python scripts/run_bitgak_paper.py submit \
            ${{ (github.event.inputs.dry_run == 'true') && '--dry-run' || '' }}

      - name: 체결 확정 · 다리 정정 · 상호 취소 (16:15 ET 이후에만)
        env:
          PYTHONUTF8: "1"
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: python scripts/run_bitgak_paper.py settle

      - name: 장부 커밋
        # always(): 주문은 이 시점에 이미 나갔다. 커밋을 건너뛰면 다음 회차가
        # 포지션을 못 보고 다리를 다시 걸거나 타임아웃을 놓친다.
        if: always()
        shell: bash
        run: |
          if [ ! -f data/bitgak_paper_ledger.jsonl ]; then
            echo "장부 없음 - 커밋 없음"; exit 0
          fi
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -- data/bitgak_paper_ledger.jsonl
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 없음"; exit 0
          fi
          git commit -m "chore: 빗각 8단계 번인 장부 $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push
