name: 페이퍼 트레이딩 자동 실행 (Toss)

on:
  schedule:
    # 한국 장마감(KST 15:30) 후
    # KST = UTC+9 → 15:30 KST = 06:30 UTC
    # UTC 07:00 실행 (30분 여유)
    - cron: "0 7 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (true=주문 없음, false=실제 주문)"
        required: false
        default: "true"
      universe:
        description: "유니버스 이름 (';'로 복수 지정, 예: 코스피 대형 30;코스닥 기술주 15)"
        required: false
        default: "코스피 대형 30;코스닥 기술주 15"
      top_n:
        description: "매수 상위 N개"
        required: false
        default: "5"
      capital_per_trade:
        description: "종목당 투입금 KRW"
        required: false
        default: "500000"
      trail_stop_pct:
        description: "트레일링 스톱 % (고점 대비, 0이면 비활성)"
        required: false
        default: "10"
      buy_score_min:
        description: "최소 매수 점수 (10~90)"
        required: false
        default: "60"
      portfolio_dd_stop_pct:
        description: "포트폴리오 드로다운 스톱 % (0이면 비활성)"
        required: false
        default: "15"
      max_sector_positions:
        description: "동일 섹터 최대 보유 종목 수 (0이면 제한 없음)"
        required: false
        default: "2"
      neutral_max_positions:
        description: "neutral 레짐 최대 포지션 수"
        required: false
        default: "7"
      bear_max_positions:
        description: "bear 레짐 최대 포지션 수"
        required: false
        default: "4"

# 동시에 두 번 실행 방지 — 동시 실행 시 peak_prices.json/signal_log.json 충돌 위험
concurrency:
  group: paper-trade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-paper-trade:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4.2.2

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 디버그 - 커밋 및 파일 확인
        run: |
          echo "=== 현재 커밋 ==="
          git log --oneline -3
          echo "=== paper_trade_runner_toss.py 상위 10줄 ==="
          head -10 paper_trade_runner_toss.py
          echo "=== Python 버전 ==="
          python --version

      - name: 토스 트레이딩 실행
        env:
          TOSS_CLIENT_ID:     ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ:   ${{ secrets.TOSS_ACCOUNT_SEQ }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # schedule 실행 시: 아래 기본값 사용
          # workflow_dispatch 실행 시: input 값 우선
          UNIVERSE:              ${{ github.event.inputs.universe || '코스피 대형 30;코스닥 기술주 15' }}
          TOP_N:                 ${{ github.event.inputs.top_n || '5' }}
          CAPITAL_PER_TRADE:     ${{ github.event.inputs.capital_per_trade || '500000' }}
          MAX_POSITIONS:         "10"
          TRAIL_STOP_PCT:        ${{ github.event.inputs.trail_stop_pct || '10' }}
          BUY_SCORE_MIN:         ${{ github.event.inputs.buy_score_min || '60' }}
          PORTFOLIO_DD_STOP_PCT: ${{ github.event.inputs.portfolio_dd_stop_pct || '15' }}
          MAX_SECTOR_POSITIONS:  ${{ github.event.inputs.max_sector_positions || '2' }}
          NEUTRAL_MAX_POSITIONS: ${{ github.event.inputs.neutral_max_positions || '7' }}
          BEAR_MAX_POSITIONS:    ${{ github.event.inputs.bear_max_positions || '4' }}
          # schedule은 항상 실제 주문, workflow_dispatch는 input 값 따름
          DRY_RUN:               ${{ github.event.inputs.dry_run || 'false' }}
        run: python paper_trade_runner_toss.py

      - name: 추적 파일 커밋 (고점·시그널 로그)
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add peak_prices.json signal_log.json equity_log.json || true
          git diff --staged --quiet || git commit -m "chore: peak & signal & equity log update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
