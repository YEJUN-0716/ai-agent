name: IC 팩터 가중치 주간 업데이트

on:
  schedule:
    # 일요일 14:00 UTC (주말 시장 휴장 중, 데이터 정적 상태에서 계산)
    - cron: "0 14 * * 0"
  workflow_dispatch:

# IC 업데이트와 paper-trade 동시 실행 방지
concurrency:
  group: ic-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-ic-weights:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-analyzer
    timeout-minutes: 120  # 캐시 미스 시 첫 실행이 오래 걸린다 (276종목 전량 다운로드)

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 3.12 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 가격 패널 캐시 복원
        uses: actions/cache@v4
        with:
          path: stock-analyzer/data/
          # 캐시 키는 불변이라 덮어쓸 수 없다. run_id로 매번 새로 저장하고
          # restore-keys 접두사로 직전 캐시를 복원하는 표준 패턴.
          # v1은 패널 스키마 버전 - 구조 변경 시 올려서 전량 재구축을 강제한다.
          key: price-panel-v1-${{ github.run_id }}
          restore-keys: |
            price-panel-v1-

      - name: EDGAR 원본 캐시 복원
        uses: actions/cache@v4
        with:
          path: stock-analyzer/data/edgar_raw/
          # 원본 JSON은 크고(약 1.4GB) 재수집이 비싸다. run_id로 저장,
          # restore-keys로 직전 것 복원. 주간 실행이라 7일 경계에서
          # 만료될 수 있으나, 만료 시 edgar_fundamentals가 재수집하므로
          # 실패하지 않고 느려질 뿐이다.
          key: edgar-raw-v1-${{ github.run_id }}
          restore-keys: |
            edgar-raw-v1-

      - name: IC 가중치 계산 및 저장
        run: python ic_weight_updater.py

      - name: ic_weights.json 커밋
        # always(): 가중치 파일은 스크립트 끝에서 한 번에 쓰인다. 뒤 스텝이
        # 실패해도 이미 쓰인 파일은 커밋한다 — 다시 계산하는 데 30~60분이다.
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add ic_weights.json || true
          git diff --staged --quiet || git commit -m "chore: IC 팩터 가중치 업데이트 $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
