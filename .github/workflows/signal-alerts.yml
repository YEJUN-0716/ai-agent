name: 퀀트 시그널 알림 (수동매매용)

on:
  # ⚠️ 크론 스케줄 비활성화 (2026-07-20) — 팩터에 측정 가능한 알파가 없음
  #
  # 유니버스를 37 → 276종목으로 확대해 5년 walk-forward IC를 재측정한 결과,
  # 전 팩터가 |ICIR| < 0.1 이었다. mom_3m은 37종목 기준 +0.077에서
  # 276종목 기준 -0.094로 부호가 뒤집혔다 — 기존 수치는 표본이 작아
  # 생긴 잡음이었다. 근거: ic_weights.json, docs/superpowers/specs/
  #
  # 예측력이 확인되지 않은 신호를 매일 매수 알림으로 보내지 않기 위해
  # 자동 발송을 멈춘다. 신호원을 다시 찾은 뒤 재활성화할 것.
  # 수동 실행(workflow_dispatch)은 그대로 가능하다.
  #
  # 미국 장마감 후 — paper-trade-us(21:30 UTC) 완료 여유 두고 22:30 UTC 실행
  # 夏(EDT): 22:30 UTC = 18:30 EDT / 冬(EST): 22:30 UTC = 17:30 EST
  # schedule:
  #   - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      universe:
        description: "유니버스 이름 (UNIVERSE_PRESETS 키 또는 쉼표구분 티커)"
        required: false
        default: "S&P 500 대형 30"
      top_n:
        description: "추천 상위 N개"
        required: false
        default: "5"
      capital:
        description: "종목당 가상 투자금 (달러, 수량 계산용)"
        required: false
        default: "100000"
      sector_neutral:
        description: "섹터 중립 팩터 스코어 사용 여부 (true/false)"
        required: false
        default: "true"
      factor_timing:
        description: "VIX 기반 팩터 타이밍 가중치 사용 여부 (true/false)"
        required: false
        default: "true"

concurrency:
  group: signal-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  signal-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-analyzer
    timeout-minutes: 20

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 퀀트 시그널 스캔 & 텔레그램 발송
        env:
          PYTHONUTF8:       "1"
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNIVERSE:         ${{ github.event.inputs.universe || 'S&P 500 대형 30' }}
          TOP_N:            ${{ github.event.inputs.top_n || '5' }}
          CAPITAL:          ${{ github.event.inputs.capital || '100000' }}
          SECTOR_NEUTRAL:   ${{ github.event.inputs.sector_neutral || 'true' }}
          FACTOR_TIMING:    ${{ github.event.inputs.factor_timing || 'true' }}
        run: python signal_worker.py

      - name: 시그널 로그 커밋 (변경 있을 때만)
        # always(): 로그는 발송보다 먼저 쓰인다. 텔레그램이 죽어도 기록은 남긴다.
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # analyst_log 는 애널리스트 성적표의 유일한 재료다. 여기서 커밋하지
          # 않으면 매 실행마다 버려져 성적이 영원히 쌓이지 않는다.
          # latest_signals.json 은 대시보드 [오늘] 화면이 읽는 오늘의 액션 목록이다.
          # 여기서 커밋하지 않으면 러너 디스크에만 남고 화면은 영원히 빈 상태가 된다.
          git add signal_log.json latest_signals.json data/analyst_log
          if ! git diff --staged --quiet; then
            git commit -m "chore: signal log update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          else
            echo "signal_log.json · latest_signals.json · analyst_log 변경 없음 — 커밋 생략"
          fi
