name: 애널리스트 점수 기록

# 성적표(누가 잘 맞히나)의 유일한 재료를 매일 쌓는 잡.
#
# 왜 signal-alerts.yml 에 얹지 않는가: 그쪽은 2026-07-20 에 크론을 껐다
# (팩터에 측정 가능한 알파가 없어 매수 알림 중단). 그런데 기록을 부르는
# 곳이 거기 하나뿐이라, 알림을 끈 순간 성적표의 재료도 같이 끊겼다.
# 매수를 추천할지와 판단을 기록할지는 별개의 결정이므로 잡을 갈랐다.
# 이 잡은 텔레그램으로 아무것도 보내지 않는다 — 기록만 한다.

on:
  # 미국 장마감(겨울 21:00 UTC / 여름 20:00 UTC) 후, daily-report(23:30 UTC)
  # 앞. 그날 종가가 확정된 뒤에 지표를 계산해야 판단이 하루 밀리지 않는다.
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:
    inputs:
      universe:
        description: "유니버스 이름 (UNIVERSE_PRESETS 키 또는 쉼표구분 티커)"
        required: false
        default: "S&P 500 전체 (500종목)"

concurrency:
  group: analyst-log
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-analyzer
    # 15분봉 스텝이 붙으면서 다운로드가 두 벌이 됐다. 500종목 분봉은 일봉보다
    # 훨씬 무겁다 — 여기서 잘리면 그날 기록이 통째로 빈다.
    #
    # 퀀트+재무가 붙으면서 종목별 yfinance .info 조회가 더해졌다(0.3초 간격 ×
    # 500종목 ≈ 10~15분). 15분봉 스텝은 이 값을 파일에서 읽어 쓰므로 조회는
    # 하루 한 번뿐이다. 야후가 클라우드 IP 를 막으면 자택 러너
    # ([self-hosted, Windows]) 로 옮긴다 — 그때 이 줄도 같이 본다.
    timeout-minutes: 70

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 애널리스트 점수 기록
        env:
          PYTHONUTF8: "1"
          UNIVERSE: ${{ github.event.inputs.universe || 'S&P 500 전체 (500종목)' }}
        run: python scripts/record_analyst_scores.py

      # 15분봉(스캘핑) 판정의 재료. 기록만 하는 일봉과 달리 **채점까지** 여기서
      # 한다 — 15분봉은 60일이 지나면 yfinance 가 더는 주지 않으므로, 그 전에
      # 선행수익률을 계산해 두지 않으면 그 날은 영영 채점할 수 없다.
      #
      # 일봉 스텝이 끝난 뒤에 돈다. 앞 스텝이 실패하면 여기까지 안 오지만,
      # 여기가 실패해도 일봉 기록은 이미 파일로 남아 다음 스텝이 커밋한다.
      - name: 15분봉 점수 기록·채점
        env:
          PYTHONUTF8: "1"
          UNIVERSE: ${{ github.event.inputs.universe || 'S&P 500 전체 (500종목)' }}
        run: python scripts/record_scalp_scores.py

      - name: 기록 커밋 (변경 있을 때만)
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # 기록 스텝이 실패해 디렉터리가 아예 없으면 git add 가 exit 1 을 내고
          # 커밋 스텝이 통째로 죽는다 — 그러면 성공한 일봉 기록까지 같이
          # 버려진다. 빈 디렉터리는 git 이 무시하므로 만들어 두는 쪽이 안전하다.
          mkdir -p data/analyst_log data/scalp_log data/scalp_returns
          git add data/analyst_log data/scalp_log data/scalp_returns
          if ! git diff --staged --quiet; then
            git commit -m "chore: analyst log $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          else
            echo "analyst_log 변경 없음 — 커밋 생략"
          fi
