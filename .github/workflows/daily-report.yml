name: 일별 P&L 리포트 (Toss)

on:
  schedule:
    # 미국 트레이딩(21:30 UTC) + 시그널 알림(22:30 UTC) 완료 후 발송
    # 23:30 UTC = KST 08:30 — 한국 기준 아침 브리핑 타이밍
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  toss-report:
    # 토스 오픈API는 IP 화이트리스트를 적용한다. 자택 IP만 등록돼 있으므로
    # 클라우드 러너로 옮기면 oauth2/token이 403 access_denied로 거부된다.
    # (40b1790에서 ubuntu-latest로 옮겼다가 07-17~28 12일간 전량 실패)
    # 클라우드로 되돌리려면 먼저 해당 러너의 고정 IP를 토스에 등록할 것.
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 토스 일별 P&L 리포트 발송
        env:
          PYTHONUTF8:         "1"
          TOSS_CLIENT_ID:     ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ:   ${{ secrets.TOSS_ACCOUNT_SEQ }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_report_toss.py
