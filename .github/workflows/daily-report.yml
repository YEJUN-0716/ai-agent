name: 일별 P&L 리포트 (Toss)

on:
  schedule:
    # paper-trade(07:00 UTC) 완료 후 충분한 여유를 두고 발송
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  toss-report:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4.2.2

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 토스 일별 P&L 리포트 발송
        env:
          PYTHONUTF8:         "1"
          TOSS_CLIENT_ID:     ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ:   ${{ secrets.TOSS_ACCOUNT_SEQ }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_report_toss.py
