name: 일별 P&L 리포트 (Toss)

on:
  schedule:
    # 미국 트레이딩(21:30 UTC) + 시그널 알림(22:30 UTC) 완료 후 발송
    # 23:30 UTC = KST 08:30 — 한국 기준 아침 브리핑 타이밍
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  toss-report:
    # BROKER=virtual 인 동안에는 클라우드 러너를 쓴다. 가상 장부 보고는 토스
    # API를 부르지 않으므로 IP 화이트리스트 제약(403 access_denied)이 없다.
    # 자택 러너는 PC가 꺼져 있으면 잡이 큐에서 몇 시간씩 기다린다 —
    # 아침 브리핑이 아침에 오지 않는다.
    #
    # ⚠️ 아래 BROKER 를 toss 로 되돌리면 이 줄도 [self-hosted, Windows] 로
    #    되돌릴 것. 안 그러면 토스 인증이 403 으로 전량 실패한다
    #    (40b1790에서 ubuntu-latest로 옮겼다가 07-17~28 12일간 겪음).
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 토스 일별 P&L 리포트 발송
        env:
          PYTHONUTF8:         "1"
          # 매매가 가상 장부로 돌고 있으므로(paper-trade-us.yml) 보고서도 같은
          # 장부를 읽어야 한다. 토스 계좌를 읽으면 실제로 5종목을 들고 있어도
          # 매일 아침 "보유 포지션 없음"이 온다. 실매매로 돌아가면 이 줄을 지운다.
          BROKER:             "virtual"
          TOSS_CLIENT_ID:     ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ:   ${{ secrets.TOSS_ACCOUNT_SEQ }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_report_toss.py
