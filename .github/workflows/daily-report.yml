name: 일별 P&L 리포트 (Toss)

on:
  schedule:
    # 미국 트레이딩(21:30 UTC) + 애널리스트 기록(22:07 UTC) 완료 후 발송.
    # 22:37 UTC = KST 07:37 — 한국 기준 아침 브리핑 타이밍.
    # 2026-08-28: 23:30 → 22:37. GitHub 예약 큐 적체로 발송이 오후 3시대까지
    # 밀렸다. 정각·30분은 예약이 몰려 더 밀리므로 :37 로 둔다.
    - cron: "37 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  toss-report:
    # 가상 장부 보고는 브로커 API를 부르지 않으므로 클라우드 러너로 충분하다.
    # (토스를 읽던 시절엔 IP 화이트리스트 403 때문에 자택 러너가 필요했다.
    #  자택 러너는 PC가 꺼져 있으면 아침 브리핑이 아침에 오지 않는다.)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-analyzer
    timeout-minutes: 5

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 토스 일별 P&L 리포트 발송
        env:
          PYTHONUTF8:         "1"
          # 러너와 같은 가상 장부(virtual_portfolio.json)를 읽는다.
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # 이 잡이 얼마나 늦게 떴는지 스스로 재려면 예약 시각이 필요하다.
          # 수동 실행(workflow_dispatch)에선 빈 값이고, 그때는 재지 않는다.
          GH_EVENT_SCHEDULE:  ${{ github.event.schedule }}
        run: python daily_report_toss.py
