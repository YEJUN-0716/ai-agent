name: 일별 P&L 리포트 (Toss)

on:
  schedule:
    # 미국 트레이딩(21:30 UTC) + 시그널 알림(22:30 UTC) 완료 후 발송
    # 23:30 UTC = KST 08:30 — 한국 기준 아침 브리핑 타이밍
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  toss-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 토스 오픈API는 IP 화이트리스트를 적용한다. self-hosted(자택 고정 IP) →
      # ubuntu-latest 전환(40b1790) 이후 403이 발생해, 러너 외부 IP를 기록해 둔다.
      - name: 러너 외부 IP 확인 (진단용)
        run: curl -s --max-time 10 https://api.ipify.org || echo "IP 조회 실패"

      - name: 토스 일별 P&L 리포트 발송
        env:
          PYTHONUTF8:         "1"
          TOSS_CLIENT_ID:     ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ:   ${{ secrets.TOSS_ACCOUNT_SEQ }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_report_toss.py
