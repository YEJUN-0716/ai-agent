<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  #scene { display:block; width:100%; }
  #scene.hoverable { cursor:pointer; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
"use strict";
/* ─────────────────────────────────────────────────────────
   퀀트 증권 사무실 — 게임 씬 (vanilla JS Streamlit 컴포넌트)

   두 가지 모드로 동작한다:
   · 대기(idle):  직원들이 사무실 전체를 자유롭게 돌아다니고,
                  마주치면 잡담(💬)하고, 가끔 제 자리에 들렀다 간다.
   · 작업(work):  사장이 종목을 지정하면 전광판에 지시가 뜨고
                  전 직원이 자리로 뛰어가 앉아 분석이 끝날 때까지
                  격렬하게 타이핑한다. (서버가 분석으로 막혀 있어도
                  iframe 애니메이션은 독립적으로 계속 돈다)

   캐릭터 클릭 → setComponentValue((room, emp)) → Python이 보고서 표시.
   ───────────────────────────────────────────────────────── */

/* ── Streamlit 컴포넌트 프로토콜 (수동 구현) ── */
function _send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
function setComponentValue(v) { _send("streamlit:setComponentValue", { value: v, dataType: "json" }); }
function setFrameHeight(h)    { _send("streamlit:setFrameHeight", { height: h }); }

/* ── 상수 ── */
const LOGICAL_W = 1240;
const TOP_BAR_H = 40;               // 전광판 영역
const ROOM_H    = 168;
const ROW_GAP   = 14;
const SLOT_W    = 64;
const DESK_DY   = 104;
const CHAR_R    = 20;
const WALK_SPD  = 48;
const RUN_SPD   = 150;
const CHAT_DIST = 28;

/* ── 전역 상태 ── */
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
let dark = false;
let working = false;
let boardTicker = null;             // 작업 중 종목
let lastResult = null;              // {ticker, score, verdict, color}
let rooms = [];
let chars = new Map();
let particles = [];
let selectedId = null;
let hoverId = null;
let canvasH = 260;
let dpr = window.devicePixelRatio || 1;
let lastT = performance.now();

const PALETTE = {
  light: { floor:"#e7d7b4", plank:"#d9c393", border:"#b8935c", label:"#3b2f1d",
           labelBg:"rgba(255,251,240,.85)", desk:"#8b6f3e", deskTop:"#a5854e",
           monitor:"#2b3242", shadow:"rgba(0,0,0,.18)",
           board:"#101826", boardBorder:"#2c3b5c", boardText:"#d6dee8", boardSub:"#7d93b8" },
  dark:  { floor:"#242b3a", plank:"#1d2331", border:"#3d4356", label:"#e8e2d2",
           labelBg:"rgba(15,22,34,.85)", desk:"#57431f", deskTop:"#6f5730",
           monitor:"#101624", shadow:"rgba(0,0,0,.45)",
           board:"#0b1220", boardBorder:"#24314d", boardText:"#d6dee8", boardSub:"#5f7396" },
};
function pal() { return dark ? PALETTE.dark : PALETTE.light; }
function rand(a, b) { return a + Math.random() * (b - a); }

/* ── 레이아웃 ── */
function layoutRooms(roomData) {
  const placed = [];
  let x = 8, y = TOP_BAR_H + 8, rowMax = 0;
  for (const r of roomData) {
    const seats = Math.max(r.chars.length, r.ghost || 0);
    const w = Math.max(150, 40 + seats * SLOT_W);
    if (x + w > LOGICAL_W - 8 && x > 8) { x = 8; y += ROOM_H + ROW_GAP; }
    placed.push(Object.assign({}, r, { x: x, y: y, w: w, h: ROOM_H }));
    x += w + 12;
    rowMax = Math.max(rowMax, y + ROOM_H);
  }
  canvasH = rowMax + 10;
  return placed;
}
function deskPos(room, i) {
  return { x: room.x + 40 + i * SLOT_W + SLOT_W / 2 - 12, y: room.y + DESK_DY };
}
function floorBounds() {
  return { x1: 26, x2: LOGICAL_W - 26, y1: TOP_BAR_H + 62, y2: canvasH - 22 };
}

/* ── 캐릭터 ── */
const BEHAVIOR = { "office-pulse": "work", "office-pulse-fast": "caution",
                   "office-shake": "alert", "office-sleep": "sleep", "": "work" };

function mergeChars(placedRooms) {
  const seen = new Set();
  placedRooms.forEach(room => {
    room.chars.forEach((c, i) => {
      const id = room.key + "|" + c.key;
      seen.add(id);
      const desk = deskPos(room, i);
      let ch = chars.get(id);
      if (!ch) {
        ch = { id: id, room: room.key, emp: c.key,
               x: -30 - Math.random() * 200, y: desk.y,
               state: working ? "rush" : "enter",
               stateT: 0, pauseT: 0, phase: Math.random() * 6.28,
               chatWith: null, chatCool: 0, facing: 1 };
        chars.set(id, ch);
      }
      ch.name = c.name; ch.avatar = c.avatar; ch.color = c.color;
      ch.behavior = BEHAVIOR[c.anim] || "work";
      ch.deskX = desk.x; ch.deskY = desk.y;
    });
  });
  for (const id of chars.keys()) if (!seen.has(id)) chars.delete(id);
}

function onModeChange() {
  for (const ch of chars.values()) {
    ch.bubble = null;
    if (working) { ch.state = "rush"; ch.chatWith = null; }
    else if (ch.state !== "enter") {
      // 일 끝! 잠깐 자리에서 만세 🎉 후 시차를 두고 흩어진다.
      // (이번 렌더에 새로 합류해 아직 입장 중인 캐릭터는 제외 — 화면 밖에서
      //  축하하다 책상으로 순간이동하는 결함 방지, 그냥 걸어 들어오게 둔다)
      ch.state = "celebrate"; ch.stateT = 0; ch.celebT = rand(1.2, 2.4);
    }
  }
}

/* ── 사장(사용자) 캐릭터: 클릭 불가, 사무실을 순찰하며 감독 ── */
const boss = { x: LOGICAL_W / 2, y: TOP_BAR_H + 100, tx: 0, ty: 0,
               state: "pause", stateT: 0, pauseT: 1.5, facing: 1, phase: 0 };
function updateBoss(dt) {
  boss.stateT += dt;
  const spd = working ? 62 : 30;                 // 작업 중엔 더 바쁘게 순찰
  if (boss.state === "pause") {
    if (boss.stateT > boss.pauseT) {
      const fb = floorBounds();
      boss.tx = rand(fb.x1 + 20, fb.x2 - 20);
      boss.ty = rand(fb.y1, fb.y2);
      boss.state = "walk"; boss.stateT = 0;
    }
  } else if (moveTowardObj(boss, boss.tx, boss.ty, spd, dt)) {
    boss.state = "pause"; boss.pauseT = working ? rand(0.6, 1.6) : rand(2, 5); boss.stateT = 0;
  }
}
function moveTowardObj(o, tx, ty, spd, dt) {
  const dx = tx - o.x, dy = ty - o.y;
  const d = Math.hypot(dx, dy);
  if (d < 2.5) { o.x = tx; o.y = ty; return true; }
  const step = Math.min(d, spd * dt);
  o.x += dx / d * step; o.y += dy / d * step;
  if (Math.abs(dx) > 1) o.facing = dx < 0 ? -1 : 1;
  return false;
}
function drawBoss(t) {
  const p = pal();
  const walking = boss.state === "walk";
  const bob = walking ? Math.abs(Math.sin(t * 8)) * 3 : Math.sin(t * 2.5) * 0.8;
  ctx.fillStyle = p.shadow;
  ctx.beginPath(); ctx.ellipse(boss.x, boss.y + 15, 13, 4, 0, 0, 6.29); ctx.fill();
  ctx.save();
  ctx.translate(boss.x, boss.y - bob);
  if (boss.facing === -1) ctx.scale(-1, 1);
  ctx.font = "30px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("🤵", 0, -3);
  ctx.restore();
  ctx.font = "700 9.5px sans-serif";
  const label = "사장님 (나)";
  const w = ctx.measureText(label).width;
  ctx.fillStyle = dark ? "rgba(80,62,20,.92)" : "rgba(245,179,1,.92)";
  ctx.beginPath(); ctx.roundRect(boss.x - w / 2 - 8, boss.y - 40, w + 16, 13, 6); ctx.fill();
  ctx.fillStyle = dark ? "#f5d878" : "#3b2f1d";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, boss.x, boss.y - 33.5);
}

/* ── 잡담 대사 ── */
const QUIPS = ["오늘 장 어때요?", "커피 한 잔?", "AAPL 갈까요?", "점심 뭐 먹죠",
               "시그널 떴어요!", "백테스트 돌려봤어요?", "MDD 조심해요",
               "리밸런싱 언제 하죠?", "존버는 승리한다", "사장님 오신다!"];

function moveToward(ch, tx, ty, spd, dt) {
  const dx = tx - ch.x, dy = ty - ch.y;
  const d = Math.hypot(dx, dy);
  if (d < 2.5) { ch.x = tx; ch.y = ty; return true; }
  const step = Math.min(d, spd * dt);
  ch.x += dx / d * step; ch.y += dy / d * step;
  if (Math.abs(dx) > 1) ch.facing = dx < 0 ? -1 : 1;
  return false;
}

function pickRoamTarget(ch) {
  const fb = floorBounds();
  const r = Math.random();
  if (r < 0.18) { ch.tx = ch.deskX; ch.ty = ch.deskY; }               // 제 자리 들르기
  else if (r < 0.34) {                                                 // 다른 직원 근처로
    const others = [...chars.values()].filter(o => o.id !== ch.id);
    if (others.length) {
      const o = others[(Math.random() * others.length) | 0];
      ch.tx = o.x + rand(-34, 34); ch.ty = o.y + rand(-16, 16);
    } else { ch.tx = rand(fb.x1, fb.x2); ch.ty = rand(fb.y1, fb.y2); }
  } else { ch.tx = rand(fb.x1, fb.x2); ch.ty = rand(fb.y1, fb.y2); }   // 아무 데나 산책
  ch.tx = Math.max(fb.x1, Math.min(fb.x2, ch.tx));
  ch.ty = Math.max(fb.y1, Math.min(fb.y2, ch.ty));
}

function tryChat(ch, now) {
  if (ch.chatCool > now) return false;
  for (const o of chars.values()) {
    if (o.id === ch.id || o.chatWith) continue;
    if (!(o.state === "roam_walk" || o.state === "roam_pause")) continue;
    if (o.chatCool > now) continue;
    if (Math.hypot(o.x - ch.x, o.y - ch.y) < CHAT_DIST) {
      ch.state = o.state = "chat";
      ch.chatWith = o.id; o.chatWith = ch.id;
      ch.stateT = o.stateT = 0;
      ch.chatDur = o.chatDur = rand(2.5, 4.5);
      ch.facing = o.x < ch.x ? -1 : 1;
      o.facing = -ch.facing;
      return true;
    }
  }
  return false;
}

function updateChar(ch, dt, t, now) {
  ch.stateT += dt;

  /* ── 작업 모드: 무조건 자리로 → 착석 근무 (조는 직원도 예외 없음) ── */
  if (working) {
    if (ch.state !== "at_desk") {
      if (moveToward(ch, ch.deskX, ch.deskY, RUN_SPD, dt)) { ch.state = "at_desk"; ch.stateT = 0; }
    } else {
      ch.x = ch.deskX; ch.y = ch.deskY;
      if (Math.random() < 0.06)
        particles.push({ x: ch.x + rand(-9, 9), y: ch.y - 3, vy: -11, life: 0.5,
                         txt: "·", size: 9, color: ch.color });
      if (Math.random() < 0.004)
        particles.push({ x: ch.x + rand(-12, 12), y: ch.y - 18, vy: -13, life: 1.1, txt: "📄", size: 10 });
    }
    return;
  }

  /* ── 대기 모드 ── */
  const b = ch.behavior;

  if (ch.state === "celebrate") {               // 분석 완료 직후 만세 (전원, 조는 직원 포함)
    if (Math.random() < 0.045)
      particles.push({ x: ch.x + rand(-14, 14), y: ch.y - 24, vy: -22, life: 1.3,
                       txt: Math.random() < 0.5 ? "🎉" : "✨", size: 12 });
    if (ch.stateT > (ch.celebT || 1.8)) { ch.state = "at_desk"; ch.stateT = -rand(0.3, 3.0); }
    return;
  }

  if (b === "sleep") {                       // 대기 상태 직원: 자리에서 낮잠
    if (ch.state !== "at_desk") {
      if (moveToward(ch, ch.deskX, ch.deskY, WALK_SPD, dt)) { ch.state = "at_desk"; ch.stateT = 0; }
    } else if (Math.random() < 0.012)
      particles.push({ x: ch.x + 10, y: ch.y - 26, vy: -14, life: 2.2, txt: "💤", size: 11 });
    return;
  }
  if (b === "alert") {                       // 경고 상태 직원: 자리 주변을 다급하게
    if (ch.state !== "panic") {
      if (moveToward(ch, ch.deskX, ch.deskY, RUN_SPD * 0.8, dt)) { ch.state = "panic"; ch.panicDir = 1; }
    } else {
      if (moveToward(ch, ch.deskX + ch.panicDir * 30, ch.deskY, RUN_SPD * 0.85, dt)) ch.panicDir *= -1;
      if (Math.random() < 0.02)
        particles.push({ x: ch.x, y: ch.y - 30, vy: -16, life: 1.0, txt: "❗", size: 12 });
    }
    return;
  }

  switch (ch.state) {
    case "enter":
    case "rush":
      if (moveToward(ch, ch.deskX, ch.deskY, WALK_SPD + 40, dt)) { ch.state = "at_desk"; ch.stateT = 0; }
      break;
    case "at_desk":                          // 잠깐 앉아 있다가 다시 어슬렁
      ch.x = ch.deskX; ch.y = ch.deskY;
      if (ch.stateT > rand(1.5, 3.0)) { ch.state = "roam_pause"; ch.pauseT = rand(0.3, 1.2); ch.stateT = 0; }
      break;
    case "roam_pause":
      if (ch.stateT > ch.pauseT) { pickRoamTarget(ch); ch.state = "roam_walk"; ch.stateT = 0; }
      break;
    case "roam_walk":
      if (moveToward(ch, ch.tx, ch.ty, WALK_SPD, dt)) {
        ch.state = "roam_pause"; ch.pauseT = rand(1.5, 4.5); ch.stateT = 0;
      } else if (Math.random() < 0.03) tryChat(ch, now);
      break;
    case "chat": {
      const partner = ch.chatWith ? chars.get(ch.chatWith) : null;
      // 실제 대사 말풍선 — 번갈아가며 한 마디씩
      if ((!ch.bubble || now > ch.bubble.until) && Math.random() < 0.02) {
        ch.bubble = { txt: QUIPS[(Math.random() * QUIPS.length) | 0], until: now + rand(1.4, 2.2) };
      }
      if (ch.stateT > (ch.chatDur || 3) || !partner || partner.state !== "chat") {
        ch.state = "roam_pause"; ch.pauseT = rand(0.5, 2); ch.stateT = 0;
        ch.chatWith = null; ch.chatCool = now + 9; ch.bubble = null;
      }
      break;
    }
    default:
      ch.state = "roam_pause"; ch.pauseT = rand(0.2, 1); ch.stateT = 0;
  }
}

/* ── 그리기 ── */
function drawTopBar(t) {
  const p = pal();
  ctx.fillStyle = p.board;
  ctx.beginPath(); ctx.roundRect(8, 4, LOGICAL_W - 16, TOP_BAR_H - 8, 8); ctx.fill();
  ctx.strokeStyle = p.boardBorder; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(8, 4, LOGICAL_W - 16, TOP_BAR_H - 8, 8); ctx.stroke();

  ctx.textBaseline = "middle";
  if (working) {
    const blink = 0.55 + 0.45 * Math.sin(t * 5);
    ctx.fillStyle = "#ef4444";
    ctx.globalAlpha = blink;
    ctx.beginPath(); ctx.arc(28, TOP_BAR_H / 2, 5, 0, 6.29); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#fca5a5"; ctx.font = "800 13px sans-serif"; ctx.textAlign = "left";
    ctx.fillText("📋 사장님 업무 지시:", 42, TOP_BAR_H / 2);
    ctx.fillStyle = "#7ee6b8"; ctx.font = "800 15px 'JetBrains Mono', monospace";
    ctx.fillText(boardTicker || "…", 190, TOP_BAR_H / 2);
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 5);
    ctx.fillStyle = pal().boardText; ctx.font = "700 12px sans-serif";
    ctx.fillText("— 전 직원 분석 작업 중…", 265, TOP_BAR_H / 2);
    ctx.globalAlpha = 1;
  } else if (lastResult) {
    ctx.fillStyle = "#10b981"; ctx.font = "700 13px sans-serif"; ctx.textAlign = "left";
    ctx.fillText("✅ 최근 분석", 24, TOP_BAR_H / 2);
    ctx.fillStyle = "#7ee6b8"; ctx.font = "800 15px 'JetBrains Mono', monospace";
    ctx.fillText(lastResult.ticker, 118, TOP_BAR_H / 2);
    ctx.fillStyle = lastResult.color || "#f59e0b"; ctx.font = "800 14px sans-serif";
    ctx.fillText(lastResult.score + "점 · " + lastResult.verdict, 185, TOP_BAR_H / 2);
    ctx.fillStyle = p.boardSub; ctx.font = "600 12px sans-serif"; ctx.textAlign = "right";
    ctx.fillText("사장님의 다음 지시를 기다리는 중 — 시세판에 종목을 입력하세요", LOGICAL_W - 26, TOP_BAR_H / 2);
  } else {
    ctx.fillStyle = p.boardText; ctx.font = "700 13px sans-serif"; ctx.textAlign = "left";
    ctx.fillText("🏢 대기 중", 24, TOP_BAR_H / 2);
    ctx.fillStyle = p.boardSub; ctx.font = "600 12px sans-serif"; ctx.textAlign = "right";
    ctx.fillText("사장님의 지시를 기다리는 중 — 아래 시세판에 종목을 입력하면 전 직원이 분석을 시작합니다", LOGICAL_W - 26, TOP_BAR_H / 2);
  }
}

function drawRoom(room, t) {
  const p = pal();
  ctx.fillStyle = p.floor;
  ctx.beginPath(); ctx.roundRect(room.x, room.y, room.w, room.h, 10); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = p.plank; ctx.lineWidth = 1;
  for (let yy = room.y + 12; yy < room.y + room.h; yy += 14) {
    ctx.beginPath(); ctx.moveTo(room.x, yy); ctx.lineTo(room.x + room.w, yy); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = p.border; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(room.x, room.y, room.w, room.h, 10); ctx.stroke();

  ctx.fillStyle = dark ? "#6f5730" : "#8b6f3e";
  ctx.beginPath(); ctx.roundRect(room.x + 8, room.y + 8, Math.min(room.w - 16, 168), 24, 5); ctx.fill();
  ctx.fillStyle = "#fdf6e3"; ctx.font = "700 11px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(room.icon + " " + room.name, room.x + 15, room.y + 21, Math.min(room.w - 30, 156));

  ctx.font = "15px serif"; ctx.textAlign = "center";
  ctx.fillText("🚰", room.x + room.w - 16, room.y + 74);
  ctx.fillText("🪴", room.x + 14, room.y + room.h - 14);

  const seats = Math.max(room.chars.length, room.ghost || 0);
  for (let i = 0; i < seats; i++) {
    const c = room.chars[i];
    const d = deskPos(room, i);
    const ghost = !c;
    ctx.globalAlpha = ghost ? 0.45 : 1;
    ctx.fillStyle = p.desk;
    ctx.beginPath(); ctx.roundRect(d.x - 22, d.y + 12, 46, 15, 3); ctx.fill();
    ctx.fillStyle = p.deskTop;
    ctx.fillRect(d.x - 22, d.y + 12, 46, 4);
    ctx.fillStyle = p.monitor;
    ctx.beginPath(); ctx.roundRect(d.x - 9, d.y - 3, 20, 14, 2); ctx.fill();
    if (!ghost) {
      const ch = chars.get(room.key + "|" + c.key);
      const seated = ch && ch.state === "at_desk";
      ctx.fillStyle = seated ? c.color : (dark ? "#1c2434" : "#3a4152");
      ctx.globalAlpha = (working && seated) ? 0.65 + 0.35 * Math.abs(Math.sin(t * 9 + i)) : 0.85;
      ctx.fillRect(d.x - 7, d.y - 1, 16, 10);
    }
    ctx.globalAlpha = 1;
  }
  if (room.ghost && room.chars.length === 0) {
    ctx.fillStyle = pal().label; ctx.globalAlpha = 0.55;
    ctx.font = "600 11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("📈 시세판에 종목을 입력하면 애널리스트팀이 출근합니다",
                 room.x + room.w / 2, room.y + 52);
    ctx.globalAlpha = 1;
  }
}

function drawChar(ch, t) {
  const p = pal();
  const walking = ["enter", "rush", "roam_walk", "panic"].includes(ch.state);
  let bob = 0, tilt = 0;
  if (ch.state === "celebrate")         bob = Math.abs(Math.sin(t * 12 + ch.phase)) * 7;
  else if (walking)                     bob = Math.abs(Math.sin(t * (ch.state === "roam_walk" ? 7 : 11) + ch.phase)) * 3.5;
  else if (ch.state === "at_desk") {
    if (working)                        bob = Math.sin(t * 10 + ch.phase) * 2.0;
    else if (ch.behavior === "sleep")   tilt = 0.35;
    else                                bob = Math.sin(t * 4 + ch.phase) * 1.1;
  } else if (ch.state === "chat")       bob = Math.sin(t * 3 + ch.phase) * 1.0;

  ctx.fillStyle = p.shadow;
  ctx.beginPath(); ctx.ellipse(ch.x, ch.y + 13, 12, 3.5, 0, 0, 6.29); ctx.fill();

  if (ch.id === selectedId || ch.id === hoverId) {
    ctx.strokeStyle = ch.id === selectedId ? "#f5b301" : ch.color;
    ctx.lineWidth = 2;
    ctx.setLineDash(ch.id === hoverId && ch.id !== selectedId ? [4, 3] : []);
    ctx.beginPath(); ctx.arc(ch.x, ch.y - 4, 19, 0, 6.29); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.save();
  ctx.translate(ch.x, ch.y - bob);
  if (tilt) ctx.rotate(tilt);
  if (ch.facing === -1) ctx.scale(-1, 1);
  ctx.font = "26px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(ch.avatar, 0, -2);
  ctx.restore();

  ctx.font = "600 9.5px sans-serif";
  const nameW = ctx.measureText(ch.name).width;
  ctx.fillStyle = p.labelBg;
  ctx.beginPath(); ctx.roundRect(ch.x - nameW / 2 - 8, ch.y - 36, nameW + 16, 13, 6); ctx.fill();
  ctx.fillStyle = ch.color;
  ctx.beginPath(); ctx.arc(ch.x - nameW / 2 - 2, ch.y - 29.5, 2.5, 0, 6.29); ctx.fill();
  ctx.fillStyle = p.label; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(ch.name, ch.x - nameW / 2 + 3, ch.y - 29);

  // 말풍선 (잡담 대사)
  if (ch.bubble && ch.bubble.until > performance.now() / 1000) {
    ctx.font = "600 9.5px sans-serif";
    const bw = ctx.measureText(ch.bubble.txt).width;
    const bx = ch.x, by = ch.y - 52;
    ctx.fillStyle = dark ? "rgba(232,238,248,.95)" : "rgba(255,255,255,.97)";
    ctx.strokeStyle = dark ? "#8fa3c4" : "#9aa7ba";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(bx - bw / 2 - 8, by - 8, bw + 16, 17, 8); ctx.fill(); ctx.stroke();
    ctx.beginPath();                                   // 꼬리
    ctx.moveTo(bx - 3, by + 9); ctx.lineTo(bx + 3, by + 9); ctx.lineTo(bx, by + 14);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#26314a"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(ch.bubble.txt, bx, by + 1);
  }
}

function drawParticles(dt) {
  particles = particles.filter(pt => (pt.life -= dt) > 0);
  particles.forEach(pt => {
    pt.y += pt.vy * dt;
    ctx.globalAlpha = Math.min(1, pt.life);
    ctx.fillStyle = pt.color || (dark ? "#cbd5e1" : "#475569");
    ctx.font = pt.size + "px serif"; ctx.textAlign = "center";
    ctx.fillText(pt.txt, pt.x, pt.y);
    ctx.globalAlpha = 1;
  });
}

/* ── 메인 루프 ── */
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - lastT) / 1000);
  lastT = nowMs;
  const t = nowMs / 1000;
  const now = t;

  ctx.clearRect(0, 0, LOGICAL_W, canvasH);
  drawTopBar(t);
  rooms.forEach(r => drawRoom(r, t));
  const list = [...chars.values()].sort((a, b) => a.y - b.y);
  list.forEach(ch => updateChar(ch, dt, t, now));
  list.forEach(ch => drawChar(ch, t));
  updateBoss(dt);
  drawBoss(t);
  drawParticles(dt);
  requestAnimationFrame(frame);
}

/* ── 입력 ── */
function logicalXY(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: (ev.clientX - r.left) * (LOGICAL_W / r.width),
           y: (ev.clientY - r.top) * (canvasH / r.height) };
}
function charAt(x, y) {
  for (const ch of chars.values())
    if (Math.hypot(ch.x - x, ch.y - y + 6) < CHAR_R) return ch;
  return null;
}
canvas.addEventListener("mousemove", ev => {
  const q = logicalXY(ev);
  const ch = charAt(q.x, q.y);
  hoverId = ch ? ch.id : null;
  canvas.classList.toggle("hoverable", !!ch);
});
canvas.addEventListener("click", ev => {
  const q = logicalXY(ev);
  const ch = charAt(q.x, q.y);
  if (ch) {
    selectedId = ch.id;
    setComponentValue({ room: ch.room, emp: ch.emp, nonce: Date.now() });
  }
});

/* ── 렌더 수신 ── */
function applyRender(args) {
  dark = !!args.dark;
  const wasWorking = working;
  working = !!args.working;
  boardTicker = args.ticker || null;
  lastResult = args.result || null;
  rooms = layoutRooms(args.rooms || []);
  mergeChars(rooms);
  if (working !== wasWorking) onModeChange();
  if (args.selected) selectedId = args.selected;
  dpr = window.devicePixelRatio || 1;
  canvas.width = LOGICAL_W * dpr;
  canvas.height = canvasH * dpr;
  canvas.style.height = "auto";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  setFrameHeight(Math.ceil(canvasH * (canvas.getBoundingClientRect().width / LOGICAL_W)) + 4);
}

window.addEventListener("message", ev => {
  const m = ev.data;
  if (m && m.type === "streamlit:render") applyRender(m.args || {});
});
window.addEventListener("resize", () => {
  if (rooms.length) setFrameHeight(Math.ceil(canvasH * (canvas.getBoundingClientRect().width / LOGICAL_W)) + 4);
});

window.chars = chars;   // 디버그/테스트용 노출
window.boss = boss;
window.getMode = () => ({ working: working, ticker: boardTicker });
_send("streamlit:componentReady", { apiVersion: 1 });
requestAnimationFrame(frame);
</script>
</body>
</html>
